# Продакшен-стек SnowBrawl на одной VPS.
#
#   Без домена (демо):  docker compose up -d            → игра на http://<ip>/
#   С доменом и TLS:    docker compose --profile tls up -d → Caddy сам получит сертификат
#
# Переменные берутся из файла .env рядом (см. .env.example).
services:
  server:
    image: ${SNOWBRAWL_IMAGE:-ghcr.io/nekrasov-sergey/snowbrawl:latest}
    container_name: snowbrawl-server
    restart: unless-stopped
    # Дефолтных 10 с не всегда хватает: сервер сначала закрывает HTTP (до 5 с) и ждёт живые
    # сокеты, а историю онлайна дописывает последней — при SIGKILL терялись её свежие минуты.
    stop_grace_period: 30s
    environment:
      SNOWBRAWL_ADDR: ":8080"
      SNOWBRAWL_ADMIN_TOKEN: ${SNOWBRAWL_ADMIN_TOKEN:?set SNOWBRAWL_ADMIN_TOKEN in .env}
      SNOWBRAWL_MAX_CONNS: ${SNOWBRAWL_MAX_CONNS:-200}
      SNOWBRAWL_LOG_LEVEL: ${SNOWBRAWL_LOG_LEVEL:-info}
      SNOWBRAWL_TRUST_PROXY: ${SNOWBRAWL_TRUST_PROXY:-false}
      # База SQLite: игроки (гости и аккаунты), график онлайна, ключ подписи кук. Суточные
      # снимки — в /data/backup. Пустое значение — временная база, пропадает при перезапуске.
      SNOWBRAWL_DB: ${SNOWBRAWL_DB:-/data/snowbrawl.db}
      # Старые файлы до базы: читаются один раз при первом старте, переносятся в базу и
      # переименовываются в *.imported (см. docs/RUNBOOK.md, «Резервные копии»).
      SNOWBRAWL_MODERATION_FILE: ${SNOWBRAWL_MODERATION_FILE:-/data/moderation.json}
      SNOWBRAWL_ONLINE_FILE: ${SNOWBRAWL_ONLINE_FILE:-/data/online.log}
      SNOWBRAWL_ACCOUNTS_FILE: ${SNOWBRAWL_ACCOUNTS_FILE:-/data/accounts.json}
      # Вход по Яндекс ID. Пустой CLIENT_ID или SECRET — вход выключен, игроки заходят гостями.
      # PUBLIC_URL нужен для redirect_uri и флага Secure у кук.
      SNOWBRAWL_YANDEX_CLIENT_ID: ${SNOWBRAWL_YANDEX_CLIENT_ID:-}
      SNOWBRAWL_YANDEX_CLIENT_SECRET: ${SNOWBRAWL_YANDEX_CLIENT_SECRET:-}
      SNOWBRAWL_PUBLIC_URL: ${SNOWBRAWL_PUBLIC_URL:-}
      # Ключ подписи кук гостя и входа. Пустой — сервер создаст его сам и сохранит в базе;
      # терять его нельзя, иначе все игроки разом станут новыми гостями или разлогинятся.
      SNOWBRAWL_AUTH_SECRET: ${SNOWBRAWL_AUTH_SECRET:-}
    volumes:
      - snowbrawl_data:/data
    ports:
      # Без Caddy сервер слушает 80-й порт напрямую. С профилем tls этот порт
      # переопределяется в override ниже, чтобы не конфликтовать с Caddy.
      - "${SNOWBRAWL_HTTP_PORT:-80}:8080"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      test: ["CMD", "/snowbrawl-server", "--help"]
      interval: 1m
      timeout: 5s
      retries: 3
      disable: true

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    container_name: snowbrawl-caddy
    restart: unless-stopped
    depends_on: [server]
    environment:
      SNOWBRAWL_DOMAIN: ${SNOWBRAWL_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  snowbrawl_data:   # /data сервера: база игроков и графика, её снимки (down -v их снесёт)
  caddy_data:
  caddy_config:
