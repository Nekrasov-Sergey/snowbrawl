<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnowBrawl admin</title>
<style>
:root { color-scheme: dark }
body { font-family: system-ui, sans-serif; background: #0e1a2b; color: #eaf2ff; padding: 16px; max-width: 1400px; margin: 0 auto }
h1 { font-size: 22px; margin: 0 0 12px }
h3 { font-size: 16px; margin: 22px 0 6px }
table { border-collapse: collapse; width: 100%; margin: 6px 0 }
td, th { border: 1px solid #3a5a80; padding: 6px 8px; font-size: 13px; text-align: left; vertical-align: top }
th { background: #17293f; font-weight: 600 }
tr.off td { opacity: .5 }
.pill { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #274363; font-size: 12px; margin: 0 6px 6px 0 }
.drain { display: block; margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #46381a; color: #ffd166; font-size: 13px }
.empty { color: #86a0bd; font-size: 13px; margin: 6px 0 }
.bar { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 12px; color: #86a0bd }
button { background: #274363; border: none; color: #eaf2ff; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer }
.team-A { color: #7cc4ff } .team-B { color: #ffb37c }
.rank-admin { color: #ffc94d; font-weight: 600 }
.rank-moderator { color: #b478ff; font-weight: 600 }
.act { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.act select, select.pick { background: #17293f; color: #eaf2ff; border: 1px solid #3a5a80; border-radius: 6px; font-size: 12px; padding: 3px 6px }
input[type=text] { background: #17293f; color: #eaf2ff; border: 1px solid #3a5a80; border-radius: 6px; font-size: 13px; padding: 5px 8px }
.danger { background: #6b2230 }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0 }
.warn { display: block; margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #4a1f26; color: #ff9aa6; font-size: 13px }
.ip { color: #86a0bd; font-variant-numeric: tabular-nums }
.err { color: #ff8b8b }
#chartBox { border: 1px solid #3a5a80; border-radius: 8px; background: #142238; padding: 8px }
#onlineChart { display: block; width: 100%; height: 200px; cursor: grab; touch-action: none }
#onlineChart.drag { cursor: grabbing }
.chartBar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; font-size: 12px; color: #86a0bd }
.chartBar button.on { background: #4aa8ff; color: #08131f }
#chartHint { margin-left: auto }
@media (max-width: 700px) {
  body { padding: 10px }
  table, tbody, tr, td { display: block; width: auto }
  thead { display: none }
  tr { border: 1px solid #3a5a80; border-radius: 8px; margin-bottom: 8px; padding: 4px }
  td { border: none; padding: 3px 6px }
  td::before { content: attr(data-h) ": "; color: #86a0bd }
}
</style>
</head>
<body>
<h1>❄️ SnowBrawl — админка</h1>
<div id="sum"></div>
<div id="drain"></div>
<div id="modbroken"></div>
<div class="bar"><span id="conn">подключаемся…</span></div>

<h3>Онлайн</h3>
<div id="chartBox">
  <div class="chartBar">
    <button data-range="3600">1 ч</button><button data-range="21600">6 ч</button>
    <button data-range="86400">24 ч</button><button data-range="604800">7 д</button>
    <button data-range="2592000">30 д</button>
    <button id="chartNow">Сейчас</button>
    <span id="chartHint">тянуть — сдвиг, колесо или щипок — масштаб</span>
  </div>
  <canvas id="onlineChart"></canvas>
</div>

<h3>Игроки <span id="playersHint" class="empty"></span></h3>
<div class="tools">
  <input type="text" id="playersQ" placeholder="ник или логин" size="22">
  <select id="playersFilter" class="pick">
    <option value="">все</option><option value="guests">гости</option><option value="yandex">Яндекс</option>
    <option value="ranked">с ролью</option><option value="banned">забаненные</option>
  </select>
  <button id="playersFind">Найти</button>
</div>
<div id="players"></div>
<div class="tools"><button id="playersPrev">← назад</button><span id="playersPage" class="empty"></span><button id="playersNext">дальше →</button></div>
<h3>Матчи</h3><div id="matches"></div>
<h3>Комнаты</h3><div id="rooms"></div>
<h3>Чат</h3>
<div class="tools"><span id="chatSize" class="empty"></span><button id="chatClear" class="danger">Очистить чат</button></div>

<script>
const token = new URLSearchParams(location.search).get('token') || '';
let es = null, last = null;

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const secs = ms => {
  const s = Math.round(ms / 1000);
  if (s < 60) return s + ' с';
  const m = Math.floor(s / 60);
  return m < 60 ? m + ' мин' : Math.floor(m / 60) + ' ч ' + (m % 60) + ' мин';
};
const mode = n => n + '×' + n;
const when = t => t ? new Date(t).toLocaleString('ru-RU') : '—';
const RANKS = { admin: 'Админ', moderator: 'Модератор' };
// Ник цветом роли — как в игре: админ золотой, модератор фиолетовый.
const nickHtml = p => p.rank ? '<span class="rank-' + p.rank + '">' + esc(p.nick) + '</span>' : esc(p.nick);

// Нарисованное состояние таблиц: id → { keys, cells }. Нужно, чтобы менять ячейки точечно.
const drawn = {};

// Таблица или строка «сейчас никого», если данных нет.
//
// Пока состав и порядок строк те же, меняем только изменившиеся ячейки. Пересобирать таблицу
// целиком нельзя: задержка живая, сводка приходит каждые пару секунд, и полная перерисовка
// захлопывала бы открытый выпадающий список роли прямо под курсором. Каждая строка приносит
// key — устойчивый признак (id сессии, код комнаты, IP), по нему и сверяем состав.
function table(id, head, rows, empty) {
  const el = document.getElementById(id);
  if (!rows || !rows.length) { el.innerHTML = '<p class="empty">' + empty + '</p>'; drawn[id] = null; return; }
  const keys = rows.map(r => r.key);
  const cells = rows.map(r => r.cells);
  const was = drawn[id];
  const body = el.querySelector('tbody');
  drawn[id] = { keys: keys, cells: cells };
  if (body && was && was.keys.length === keys.length && was.keys.every((k, i) => k === keys[i])) {
    rows.forEach((r, i) => {
      const tr = body.children[i];
      tr.classList.toggle('off', !!r.off);
      r.cells.forEach((c, j) => { if (was.cells[i][j] !== c) tr.children[j].innerHTML = c; });
    });
    return;
  }
  el.innerHTML = '<table><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr' + (r.off ? ' class="off"' : '') + '>' +
      r.cells.map((c, i) => '<td data-h="' + head[i] + '">' + c + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>';
}

function place(p, now) {
  // Тренировка идёт в браузере игрока: сервер знает о ней со слов клиента и держит его в меню.
  if (p.training) {
    return 'тренировка с ботами ' + mode(p.trainingMode) +
      (p.trainingRole ? ', ' + esc(p.trainingRole) : '') + ', арена ' + (p.trainingArena || 0) +
      ' (' + secs(now - new Date(p.trainingSince).getTime()) + ')';
  }
  if (p.place === 'menu') return 'в меню';
  if (p.place === 'room') return 'в комнате ' + esc(p.where);
  if (p.place === 'match') return 'в матче' + (p.where ? ', комната ' + esc(p.where) : '');
  return esc(p.place);
}

// Состав матча: команда A против B, с пометками кто бот и за кого играет бот.
function roster(players) {
  const side = t => (players || []).filter(p => p.team === t).map(p => {
    let s = esc(p.nick);
    if (p.bot) s += ' 🤖';
    else if (p.left) s += ' ⚠ вышел';
    else if (p.botNow) s += ' ⚠ бот';
    else if (!p.online) s += ' ⚠ нет связи';
    return s;
  }).join(', ') || '—';
  return '<span class="team-A">' + side('A') + '</span> против <span class="team-B">' + side('B') + '</span>';
}

// Действия модерации: роли и баны лежат в записи игрока, страница только вызывает ручки.
async function post(path, body, method) {
  const r = await fetch('/admin' + path + (path.indexOf('?') < 0 ? '?' : '&') + 'token=' + encodeURIComponent(token), {
    method: method || 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : null,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { alert('Ошибка: ' + (data.error || r.status)); return null; }
  return data;
}

// Ник записи для подтверждения: оно должно называть человека, а не id.
function nickOf(id) {
  const a = players.find(x => x.id === id);
  return a ? a.nick : id;
}
async function setAccountRank(id, rank) {
  const what = rank ? 'выдать роль «' + RANKS[rank] + '»' : 'снять роль';
  if (!confirm('Игрок ' + nickOf(id) + '\n' + what + '?')) { renderPlayers(); return; }
  if (await post('/account/rank', { id: id, rank: rank })) loadPlayers();
}
async function banAccount(id) {
  if (!confirm('Забанить игрока ' + nickOf(id) + '?\nОн не сможет играть ни с одного устройства, где вошёл под этой записью.')) return;
  const res = await post('/account/ban', { id: id, reason: '' });
  if (res) { alert('Забанено. Выкинуто сессий: ' + res.kicked); loadPlayers(); }
}
async function unbanAccount(id) {
  if (await post('/account/ban?id=' + encodeURIComponent(id), null, 'DELETE')) loadPlayers();
}
// Выбор роли и кнопка бана для записи игрока.
function actions(id, rank, banned) {
  return '<div class="act"><select data-id="' + esc(id) + '" class="accRank">' +
    ['', 'moderator', 'admin'].map(v => '<option value="' + v + '"' + (v === (rank || '') ? ' selected' : '') + '>' +
      (RANKS[v] || 'Игрок') + '</option>').join('') + '</select>' +
    (banned
      ? '<button class="accUnban" data-id="' + esc(id) + '">Разбанить</button>'
      : '<button class="accBan danger" data-id="' + esc(id) + '">Бан</button>') + '</div>';
}
function bindActions() {
  document.querySelectorAll('.accRank').forEach(el => { el.onchange = () => setAccountRank(el.dataset.id, el.value); });
  document.querySelectorAll('.accBan').forEach(el => { el.onclick = () => banAccount(el.dataset.id); });
  document.querySelectorAll('.accUnban').forEach(el => { el.onclick = () => unbanAccount(el.dataset.id); });
}

// Игроки — одна таблица на живые сессии и записи из базы. Состав и порядок считает сервер
// (/admin/players: сначала в игре, затем админы, модераторы, затем кто заходил позже, затем по
// нику), потому что только он видит и сессии, и базу, а записей тысячи. Живые ячейки — статус и
// пинг — берутся из потока состояния по id сессии: они меняются каждую секунду, и перезапрашивать
// ради них список незачем. Сам список перезапрашивается, когда в потоке меняется состав сессий,
// их связь или роль, а ещё по поиску, при листании и после каждого действия.
let players = [], playersPage = 0, playersTotal = 0, playersPer = 50, playersSig = '', playersTimer = null;
async function loadPlayers() {
  const q = document.getElementById('playersQ').value.trim();
  const f = document.getElementById('playersFilter').value;
  const r = await fetch('/admin/players?token=' + encodeURIComponent(token) + '&q=' + encodeURIComponent(q) +
    '&filter=' + encodeURIComponent(f) + '&page=' + playersPage);
  if (!r.ok) { document.getElementById('playersHint').textContent = 'не удалось загрузить'; return; }
  const data = await r.json();
  players = data.rows || [];
  playersTotal = data.total || 0;
  playersPer = data.perPage || 50;
  document.getElementById('playersHint').innerHTML = data.broken
    ? '<span class="err">база была испорчена и создана заново</span>'
    : 'найдено: ' + playersTotal;
  const pages = Math.max(1, Math.ceil(playersTotal / playersPer));
  document.getElementById('playersPage').textContent = 'страница ' + (playersPage + 1) + ' из ' + pages;
  document.getElementById('playersPrev').disabled = playersPage <= 0;
  document.getElementById('playersNext').disabled = playersPage + 1 >= pages;
  renderPlayers();
}
// Отпечаток того, от чего зависят состав и порядок списка: сессии, их связь и роль.
function sessionsSig(s) {
  return (s.sessions || []).map(p => p.id + ':' + (p.online ? 1 : 0) + ':' + (p.rank || '')).sort().join(',');
}
const KIND = { guest: 'гость', yandex: 'Яндекс', nocookie: 'гость без кук' };
function renderPlayers() {
  const byID = {};
  ((last && last.sessions) || []).forEach(p => { byID[p.id] = p; });
  const now = last ? new Date(last.now).getTime() : Date.now();
  table('players', ['ник', 'кто', 'статус', 'пинг', 'последний заход', 'действия'],
    players.map(a => {
      const sess = a.session ? byID[a.session] : null;
      let status = 'не в игре';
      if (sess) status = sess.online ? place(sess, now) : 'нет связи ' + secs(now - new Date(sess.offlineSince).getTime());
      const rank = sess ? sess.rank : a.rank;
      return {
        key: a.id || a.session,
        off: !(sess && sess.online),
        cells: [nickHtml({ nick: a.nick, rank: rank }) + (a.banned ? ' 🚫' : ''),
          KIND[a.kind] + (a.login ? ' · ' + esc(a.login) : ''),
          status,
          // Задержку мерит сервер — это ровно то число, что игрок видит у себя в углу экрана;
          // «—» значит «не в игре» или «ещё не измерена», а не «нулевая».
          sess && sess.online && sess.ping ? sess.ping + ' мс' : '—',
          when(a.seenAt),
          // У гостя без кук записи нет — роль и бан ему не выдать.
          a.id ? actions(a.id, rank, a.banned) : '—'],
      };
    }), 'Никого не нашлось.');
  bindActions();
}

function render(s) {
  last = s;
  document.getElementById('sum').innerHTML =
    '<span class="pill">build ' + esc(s.build) + '</span>' +
    '<span class="pill">сессий ' + s.players + ', на связи ' + s.online + '</span>' +
    '<span class="pill">матчей ' + s.matchesLive + '</span>' +
    (s.training ? '<span class="pill">в тренировке ' + s.training + '</span>' : '');

  document.getElementById('drain').innerHTML = s.draining
    ? '<div class="drain">Идёт выкладка новой версии (с ' + new Date(s.drainSince).toLocaleTimeString() +
      '). Новые матчи не начинаются, текущие доигрываются. Снимется само после перезапуска сервера.</div>'
    : '';
  document.getElementById('modbroken').innerHTML = s.storeBroken
    ? '<div class="warn">База при старте была повреждена: она отложена рядом с суффиксом .bad, ' +
      'записи игроков сброшены. Восстановите её из снимка в каталоге backup.</div>'
    : '';

  const now = new Date(s.now).getTime();
  // Список игроков: состав поменялся — перезапрос (с паузой, чтобы серия входов не дёргала
  // сервер на каждом кадре), иначе только живые ячейки.
  const sig = sessionsSig(s);
  if (sig !== playersSig) {
    playersSig = sig;
    clearTimeout(playersTimer);
    playersTimer = setTimeout(loadPlayers, 1000);
  }
  renderPlayers();

  table('matches', ['состав', 'режим', 'арена', 'людей', 'на связи', 'начат', 'длительность', 'комната'],
    (s.matches || []).map(m => ({
      key: m.id,
      cells: [roster(m.players), mode(m.mode), m.arena, m.humans, m.online,
        new Date(m.created).toLocaleTimeString(),
        // До конца отсчёта боя ещё нет: показываем это отдельно, иначе длительность врёт.
        now < new Date(m.startsAt).getTime()
          ? 'отсчёт'
          : secs(now - new Date(m.startsAt).getTime()),
        m.roomCode || '—'],
    })), 'Матчей нет.');

  table('rooms', ['код', 'участники', 'игра', 'режим', 'арена', 'доступ', 'в матче'],
    (s.rooms || []).map(r => ({
      key: r.code,
      cells: [esc(r.code),
        (r.players || []).map(p => esc(p.nick || p.id) + (p.host ? ' ★' : '') +
          (p.team ? ' (' + p.team + ')' : '') + (p.ready ? ' ✓' : '') + (p.online ? '' : ' ⚠')).join(', ') || '—',
        esc(r.gameMode || 'pvp'), mode(r.mode), r.arena,
        r.visibility === 'closed' ? '🔒 закрытая' : 'открытая',
        r.inMatch ? 'да' : 'нет'],
    })), 'Комнат нет.');

  // «Очистить чат» стирает только общий: чаты комнат живут не дольше своих комнат.
  document.getElementById('chatSize').textContent =
    'сообщений в общем чате: ' + (s.chatSize || 0) + ', в чатах комнат: ' + (s.roomChat || 0);

}

// Состояние приходит потоком: сервер шлёт сводку сразу, как она изменилась. Опроса нет,
// поэтому и надписи «обновлено N с назад» нет — данные всегда свежие. Переподключение
// EventSource делает сам.
function connect() {
  es = new EventSource('/admin/stream?token=' + encodeURIComponent(token));
  es.onopen = () => { document.getElementById('conn').textContent = 'связь есть, состояние приходит сразу'; };
  es.onmessage = e => { try { render(JSON.parse(e.data)); } catch (err) { /* игнор битого кадра */ } };
  es.onerror = () => { document.getElementById('conn').innerHTML = '<span class="err">нет связи с сервером</span>'; };
}
document.getElementById('playersFind').onclick = () => { playersPage = 0; loadPlayers(); };
document.getElementById('playersQ').addEventListener('keydown', e => { if (e.key === 'Enter') { playersPage = 0; loadPlayers(); } });
document.getElementById('playersFilter').onchange = () => { playersPage = 0; loadPlayers(); };
document.getElementById('playersPrev').onclick = () => { if (playersPage > 0) { playersPage--; loadPlayers(); } };
document.getElementById('playersNext').onclick = () => { playersPage++; loadPlayers(); };
document.getElementById('chatClear').onclick = async () => {
  if (!confirm('Удалить все сообщения общего чата у всех игроков?')) return;
  const res = await post('/chat/clear');
  if (res) alert('Удалено сообщений: ' + res.cleared);
};

// ---- график онлайна ----
// Живёт отдельно от SSE: ряд не входит в сводку (десятки тысяч точек в каждом кадре — впустую,
// и он менялся бы каждую минуту, убивая диффинг потока). Поэтому своя ручка и свой опрос.
//
// Плавность держится на кэше: неделю поминутно тянем ОДИН раз и дальше рисуем панораму и зум
// из памяти на каждое движение мыши. Раньше кадр появлялся только после ответа сервера, и
// перетаскивание шло рывками со скоростью запросов.
const chart = {
  canvas: document.getElementById('onlineChart'),
  from: 0, to: 0,                                  // окно в секундах unix
  fine: { from: 0, to: 0, step: 60, points: [] },  // неделя поминутно
  deep: { from: 0, to: 0, step: 0, points: [] },   // глубже недели — крупным шагом
  hover: null, drag: null, pinch: null, frame: 0, broken: false,
  loading: false, err: false, deepTimer: null, deepAbort: null,
  yTop: 4, holdY: false, holdTimer: null
};
const MIN_SPAN = 600, MAX_SPAN = 31 * 24 * 3600;
const FINE_SPAN = 7 * 24 * 3600, FINE_MAX = 12000;

function chartSetRange(span) {
  const now = Math.floor(Date.now() / 1000);
  chart.to = now; chart.from = now - span;
  chartDraw();
  chartNeedDeep();
}
function chartAtNow() { return Math.abs(chart.to - Math.floor(Date.now() / 1000)) < 90; }

async function chartFetch(from, to, max, signal) {
  const q = '/admin/online-series?from=' + Math.round(from) + '&to=' + Math.round(to) +
    '&max=' + max + '&token=' + encodeURIComponent(token);
  const res = await fetch(q, { headers: { 'X-Admin-Token': token }, signal });
  if (!res.ok) throw new Error('http ' + res.status);
  const data = await res.json();
  return { step: data.step || 60, points: data.points || [], broken: !!data.broken };
}

// Неделя поминутно: первый раз целиком, дальше только хвост с момента последней точки.
async function chartTopUp() {
  const now = Math.floor(Date.now() / 1000);
  const full = !chart.fine.points.length;
  const from = full ? now - FINE_SPAN : chart.fine.points[chart.fine.points.length - 1][0] - 120;
  try {
    const got = await chartFetch(from, now, full ? FINE_MAX : 4000);
    chart.broken = got.broken;
    chart.err = false;
    if (full || got.step !== 60) {
      chart.fine.points = got.points;
      chart.fine.step = got.step;
    } else {
      const last = chart.fine.points.length ? chart.fine.points[chart.fine.points.length - 1][0] : 0;
      for (const pt of got.points) if (pt[0] > last) chart.fine.points.push(pt);
    }
    // Держим в памяти ровно неделю: точки левее приедут при необходимости крупным шагом.
    const cut = now - FINE_SPAN;
    while (chart.fine.points.length && chart.fine.points[0][0] < cut) chart.fine.points.shift();
    chart.fine.from = chart.fine.points.length ? chart.fine.points[0][0] : cut;
    chart.fine.to = now;
  } catch (err) {
    chart.err = true;
  }
  chartDraw();
}

// Окно ушло левее недели — тянем его крупным шагом. Отдельный запрос с отменой предыдущего:
// во время перетаскивания окно меняется чаще, чем успевает отвечать сервер.
function chartNeedDeep() {
  if (chart.from >= chart.fine.from) return;
  clearTimeout(chart.deepTimer);
  chart.deepTimer = setTimeout(async () => {
    const from = chart.from - (chart.to - chart.from) * 0.5;
    const to = chart.to + (chart.to - chart.from) * 0.5;
    if (chart.deepAbort) chart.deepAbort.abort();
    const ac = new AbortController();
    chart.deepAbort = ac;
    chart.loading = true;
    chartDraw();
    try {
      const width = Math.max(120, Math.round(chart.canvas.clientWidth));
      const got = await chartFetch(from, to, width * 2, ac.signal);
      chart.deep = { from: from, to: to, step: got.step, points: got.points };
      chart.broken = got.broken;
      chart.err = false;
    } catch (err) {
      if (err.name !== 'AbortError') chart.err = true;
    } finally {
      if (chart.deepAbort === ac) { chart.deepAbort = null; chart.loading = false; }
      chartDraw();
    }
  }, 180);
}

// Какой ряд рисуем: поминутный, пока окно внутри недели, иначе крупный.
function chartSeries() {
  if (chart.from >= chart.fine.from && chart.fine.points.length) return chart.fine;
  if (chart.deep.points.length && chart.from >= chart.deep.from && chart.to <= chart.deep.to) return chart.deep;
  return chart.fine.points.length ? chart.fine : chart.deep;
}
// Точки окна с прореживанием: на экран шириной 900 px больше пары тысяч точек не нужно, а
// ломаная из десяти тысяч заметно тормозила бы перетаскивание.
function chartVisible(series, limit) {
  const pts = series.points, out = [];
  const lo = chart.from - series.step, hi = chart.to + series.step;
  let i = 0;
  while (i < pts.length && pts[i][0] < lo) i++;
  let n = 0;
  for (let j = i; j < pts.length && pts[j][0] <= hi; j++) n++;
  const stride = Math.max(1, Math.ceil(n / limit));
  for (let j = i; j < pts.length && pts[j][0] <= hi; j += stride) out.push(pts[j]);
  return { points: out, step: series.step * stride };
}

function chartDraw() {
  const c = chart.canvas, dpr = window.devicePixelRatio || 1;
  const w = Math.max(120, c.clientWidth), h = c.clientHeight || 200;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  // Подсветку диапазона обновляем до всех ранних выходов: иначе после панорамы в область
  // без данных кнопка продолжала показывать прежний диапазон, то есть врать.
  const spanNow = chart.to - chart.from;
  document.querySelectorAll('.chartBar button[data-range]').forEach(b => {
    b.classList.toggle('on', Math.abs(Number(b.dataset.range) - spanNow) < spanNow * 0.05);
  });
  const padL = 34, padR = 8, padT = 10, padB = 20;
  const plotW = Math.max(1, w - padL - padR), plotH = Math.max(1, h - padT - padB);

  const vis = chartVisible(chartSeries(), Math.round(plotW * 2));
  const pts = vis.points;
  // Шкала Y замирает на время жеста: иначе при каждом новом максимуме график прыгал по
  // вертикали прямо под рукой.
  if (!chart.holdY) {
    const maxN = pts.length ? Math.max(1, ...pts.map(p => p[1])) : 1;
    chart.yTop = maxN <= 4 ? 4 : Math.ceil(maxN * 1.15);
  }
  const top = chart.yTop;
  const xOf = sec => padL + ((sec - chart.from) / Math.max(1, chart.to - chart.from)) * plotW;
  const yOf = n => padT + plotH - (n / top) * plotH;

  // сетка и подписи
  g.strokeStyle = '#22384f'; g.fillStyle = '#86a0bd'; g.font = '11px system-ui'; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const n = Math.round(top * i / 4), y = Math.round(yOf(n)) + 0.5;
    g.beginPath(); g.moveTo(padL, y); g.lineTo(w - padR, y); g.stroke();
    g.fillText(String(n), 6, y + 4);
  }
  const span = chart.to - chart.from;
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const sec = chart.from + span * i / ticks, x = xOf(sec);
    const d = new Date(sec * 1000);
    const label = span > 3 * 86400 ? d.toLocaleDateString([], { day: '2-digit', month: '2-digit' })
      : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    g.textAlign = i === 0 ? 'left' : (i === ticks ? 'right' : 'center');
    g.fillText(label, Math.min(w - padR, Math.max(padL, x)), h - 6);
  }
  g.textAlign = 'left';

  if (pts.length) {
    // Минуты, когда сервер не работал, сервер присылает нулями (см. internal/onlinestat), так что
    // разрыв бывает только там, где истории нет вовсе, — соединять туда точки прямой нельзя.
    const gap = vis.step * 1.5;
    g.strokeStyle = '#4aa8ff'; g.lineWidth = 2; g.lineJoin = 'round';
    g.beginPath();
    let started = false;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], prev = i ? pts[i - 1] : null;
      if (!started || (prev && p[0] - prev[0] > gap)) { g.moveTo(xOf(p[0]), yOf(p[1])); started = true; }
      else g.lineTo(xOf(p[0]), yOf(p[1]));
    }
    g.stroke();
  } else if (!chart.loading) {
    g.fillStyle = '#86a0bd'; g.font = '13px system-ui';
    g.fillText('за это время данных нет', padL + 8, padT + 18);
  }
  if (chart.loading || chart.err) {
    g.font = '11px system-ui'; g.textAlign = 'right';
    g.fillStyle = chart.err ? '#ff8b8b' : '#86a0bd';
    g.fillText(chart.err ? 'ряд не загрузился' : 'подгружаю…', w - padR, padT + 10);
    g.textAlign = 'left';
  }

  if (chart.hover) {
    const p = chart.hover, x = xOf(p[0]), y = yOf(p[1]);
    g.strokeStyle = '#3a5a80'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, padT); g.lineTo(x, padT + plotH); g.stroke();
    g.fillStyle = '#4aa8ff'; g.beginPath(); g.arc(x, y, 3, 0, Math.PI * 2); g.fill();
    const txt = p[1] + ' онлайн · ' + new Date(p[0] * 1000).toLocaleString();
    g.font = '12px system-ui';
    const tw = g.measureText(txt).width + 10;
    const tx = Math.min(w - padR - tw, Math.max(padL, x - tw / 2));
    g.fillStyle = '#0b1622'; g.fillRect(tx, padT, tw, 20);
    g.fillStyle = '#eaf2ff'; g.fillText(txt, tx + 5, padT + 14);
  }
}

// Доля ширины области графика под точкой экрана: 0 — левый край, 1 — правый.
function chartFracAt(clientX) {
  const r = chart.canvas.getBoundingClientRect();
  const padL = 34, padR = 8;
  return (clientX - r.left - padL) / Math.max(1, r.width - padL - padR);
}
function chartSecAt(clientX) {
  return chart.from + chartFracAt(clientX) * (chart.to - chart.from);
}
function chartZoom(sec, factor) {
  let span = (chart.to - chart.from) * factor;
  span = Math.max(MIN_SPAN, Math.min(MAX_SPAN, span));
  const frac = Math.min(1, Math.max(0, (sec - chart.from) / Math.max(1, chart.to - chart.from)));
  chart.from = sec - span * frac;
  chart.to = chart.from + span;
  chartClamp();
  chartFrame();
}
// Окно не пускаем в будущее: справа всегда «сейчас».
function chartClamp() {
  const now = Math.floor(Date.now() / 1000);
  if (chart.to > now) { const span = chart.to - chart.from; chart.to = now; chart.from = now - span; }
}
// Жест начался — шкалу Y держим; через полсекунды после последнего движения отпускаем.
function chartHoldY(on) {
  clearTimeout(chart.holdTimer);
  if (on) { chart.holdY = true; return; }
  chart.holdTimer = setTimeout(() => { chart.holdY = false; chartDraw(); }, 500);
}

chart.canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' && chart.pinch === null && e.isPrimary === false) return;
  chart.canvas.setPointerCapture(e.pointerId);
  chart.drag = { x: e.clientX, from: chart.from, to: chart.to };
  chart.canvas.classList.add('drag');
  chartHoldY(true);
});
chart.canvas.addEventListener('pointermove', e => {
  if (chart.drag) {
    const r = chart.canvas.getBoundingClientRect();
    const perPx = (chart.drag.to - chart.drag.from) / Math.max(1, r.width - 42);
    const shift = (e.clientX - chart.drag.x) * perPx;
    chart.from = chart.drag.from - shift;
    chart.to = chart.drag.to - shift;
    if (chart.from < Math.floor(Date.now() / 1000) - MAX_SPAN) {
      const span = chart.to - chart.from;
      chart.from = Math.floor(Date.now() / 1000) - MAX_SPAN;
      chart.to = chart.from + span;
    }
    chartClamp();
    chartDraw();      // кадр сразу, из уже загруженных точек
    chartNeedDeep();  // сеть — следом и только если вышли за неделю
    return;
  }
  const series = chartSeries();
  if (!series.points.length) return;
  const sec = chartSecAt(e.clientX);
  let best = null, bestD = Infinity;
  for (const p of series.points) { const d = Math.abs(p[0] - sec); if (d < bestD) { bestD = d; best = p; } }
  chart.hover = bestD <= series.step * 2 ? best : null;
  chartDraw();
});
chart.canvas.addEventListener('pointerup', e => {
  chart.drag = null; chart.canvas.classList.remove('drag');
  chartHoldY(false);
  if (chart.canvas.hasPointerCapture(e.pointerId)) chart.canvas.releasePointerCapture(e.pointerId);
});
chart.canvas.addEventListener('pointerleave', () => { chart.hover = null; chartDraw(); });
// Колесо и щипок на тачпаде: щипок браузер присылает как wheel с ctrlKey, десятками событий за
// жест, поэтому шаг масштаба пропорционален deltaY, а не фиксирован на событие — иначе лёгкое
// движение пальцев проматывало масштаб в разы. Щелчок колеса мыши (~100 px) — примерно ×1.16.
const WHEEL_K = 0.0015, WHEEL_PINCH_K = 0.005;
chart.canvas.addEventListener('wheel', e => {
  e.preventDefault();
  chartHoldY(true); chartHoldY(false);
  const px = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  const d = Math.max(-120, Math.min(120, px));
  chartZoom(chartSecAt(e.clientX), Math.exp(d * (e.ctrlKey ? WHEEL_PINCH_K : WHEEL_K)));
}, { passive: false });
// Safari на Mac шлёт щипок тачпада не колесом, а gesture-событиями с накопленным scale.
let gesture = null;
chart.canvas.addEventListener('gesturestart', e => {
  e.preventDefault();
  if (chart.pinch) return; // на iPhone щипок уже ведут touch-события
  gesture = { span: chart.to - chart.from, anchor: chartSecAt(e.clientX), x: e.clientX };
  chartHoldY(true);
});
chart.canvas.addEventListener('gesturechange', e => {
  e.preventDefault();
  if (!gesture || chart.pinch) return;
  const span = Math.max(MIN_SPAN, Math.min(MAX_SPAN, gesture.span * Math.pow(1 / Math.max(0.01, e.scale), PINCH_POWER)));
  chart.from = gesture.anchor - chartFracAt(gesture.x) * span;
  chart.to = chart.from + span;
  chartClamp();
  chartFrame();
});
chart.canvas.addEventListener('gestureend', e => { e.preventDefault(); gesture = null; chartHoldY(false); });
// Щипок двумя пальцами: без него на телефоне масштаб недоступен. Окно считается от состояния
// на начало жеста, а не от прошлого кадра: иначе ошибки каждого touchmove копились и график
// прыгал. Степень 0.45 гасит чувствительность — разведение пальцев вдвое даёт ×1.37, а не ×2.
// Момент под серединой пальцев остаётся под ней, так что двумя пальцами можно и сдвигать.
const PINCH_POWER = 0.45, PINCH_DEADZONE = 4;
function touchPair(e) {
  const a = e.touches[0], b = e.touches[1];
  return { dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), mid: (a.clientX + b.clientX) / 2 };
}
chart.canvas.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const t = touchPair(e);
  chartHoldY(true);
  chart.drag = null;
  if (!chart.pinch) {
    chart.pinch = { dist: Math.max(1, t.dist), span: chart.to - chart.from, anchor: chartSecAt(t.mid), moved: false };
    return;
  }
  const p = chart.pinch;
  if (!p.moved && Math.abs(t.dist - p.dist) < PINCH_DEADZONE) return; // дрожь пальцев — не зум
  p.moved = true;
  const span = Math.max(MIN_SPAN, Math.min(MAX_SPAN, p.span * Math.pow(p.dist / Math.max(1, t.dist), PINCH_POWER)));
  chart.from = p.anchor - chartFracAt(t.mid) * span;
  chart.to = chart.from + span;
  chartClamp();
  chartFrame();
}, { passive: false });
function pinchEnd(e) {
  if (e.touches.length >= 2) return;
  chart.pinch = null;
  chartHoldY(false);
}
chart.canvas.addEventListener('touchend', pinchEnd);
chart.canvas.addEventListener('touchcancel', pinchEnd);
// Одна перерисовка на кадр: touchmove приходит чаще, чем экран успевает обновиться.
function chartFrame() {
  if (chart.frame) return;
  chart.frame = requestAnimationFrame(() => { chart.frame = 0; chartDraw(); chartNeedDeep(); });
}

document.querySelectorAll('.chartBar button[data-range]').forEach(b => {
  b.onclick = () => chartSetRange(Number(b.dataset.range));
});
document.getElementById('chartNow').onclick = () => chartSetRange(chart.to - chart.from);
window.addEventListener('resize', () => { chartDraw(); });
// Хвост ряда догоняем всегда (он дешёвый), а окно двигаем только у правого края: иначе
// автообновление дёргало бы график, который администратор увёл в прошлое.
setInterval(() => {
  const atNow = chartAtNow();
  chartTopUp().then(() => { if (atNow) chartSetRange(chart.to - chart.from); });
}, 60000);

chart.from = Math.floor(Date.now() / 1000) - 21600;
chart.to = Math.floor(Date.now() / 1000);
chartTopUp();
loadPlayers();
connect();
</script>
</body>
</html>
