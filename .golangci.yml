version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - revive
    - unconvert
    - unparam
    - bodyclose
    - errorlint
    - gosec
  settings:
    gosec:
      excludes:
        - G404 # math/rand для игровой случайности допустим
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, unparam, bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Nekrasov-Sergey/snowbrawl
