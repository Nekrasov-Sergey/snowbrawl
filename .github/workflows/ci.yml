name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        # Через go run: бинарь линтера собирается тулчейном проекта (Go 1.27),
        # готовые сборки под старый Go отказываются проверять более новый код.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...
      - name: Test
        run: |
          set -o pipefail
          if ! go test -race -v ./... 2>&1 | tee /tmp/t.log; then
            echo '--- failure excerpt ---'
            grep -nE '^--- FAIL|^=== RUN|panic:|DATA RACE|WARNING: DATA RACE|\.go:[0-9]+:|FAIL\s' /tmp/t.log | tail -80 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Benchmark goja (17 матчей 4×4)
        run: go test ./internal/sim/ -run xxx -bench FullLoad -benchtime 3x | tee bench.txt
      - name: Build image (без публикации)
        run: docker build -f deploy/Dockerfile --build-arg BUILD_VERSION=ci-${GITHUB_SHA::7} -t snowbrawl:ci .
