# Override для профиля TLS: наружу торчит только Caddy, он же держит сертификат.
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml --profile tls up -d
services:
  server:
    # Порт публикуется только на loopback: внешний трафик идёт через Caddy, а deploy.sh
    # проверяет здоровье и дренаж напрямую в сервер, минуя прокси.
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      SNOWBRAWL_TRUST_PROXY: "true"
