# Релиз по тегу v*: тесты → образ в GHCR → выкладка на VPS по SSH с дренажом.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST  — IP или домен VPS
#   DEPLOY_USER  — пользователь SSH (например, deploy)
#   DEPLOY_KEY   — приватный SSH-ключ (ed25519) этого пользователя
#   DEPLOY_PATH  — каталог на VPS с docker-compose.yml и .env (например, /opt/snowbrawl)
# Если секреты деплоя не заданы, шаг выкладки пропускается — образ всё равно публикуется.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/snowbrawl

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./...

      - name: Image name (lowercase)
        id: img
        run: echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: BUILD_VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.img.outputs.image }}:${{ github.ref_name }}
            ${{ steps.img.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Deploy to VPS
        # Контекст secrets недоступен в if, поэтому проверяем через env job-а (см. ниже).
        if: env.DEPLOY_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/id_deploy deploy/deploy.sh deploy/docker-compose.yml deploy/docker-compose.tls.yml deploy/Caddyfile \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && chmod +x deploy.sh && ./deploy.sh '${{ github.ref_name }}'"
